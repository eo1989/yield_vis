[project]
name = "yield-vis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "altair",
  "anyio>=4.6.2.post1",
  "bokeh",
  "dash-ag-grid>=35.3.0",
  "dash-bootstrap-templates>=3.0.1",
  "dash-iconify>=0.1.2",
  "dash-mantine-components>=2.8.0",
  "dash-vega-components",
  "dash[async,fastapi,quart]>=4.4.1",
  "financepy>=1.0.1",
  "fredapi>=0.5.2",
  "great-tables",
  "gunicorn>=23.0.0",
  "holoviews",
  "hvplot",
  "itables",
  "kaleido>=1.4.0",
  "kitcat>=2.0.2",
  "matplotlib>=3.11.2",
  "numpy>=2.5.3",
  "pandas>=3.0.6",
  "pandas-datareader>=0.11.0",
  "panel",
  "param",
  "plotly>=7.1.0",
  "polars[all]>=1.44.2",
  "pyarrow>=18.0.0",
  "requests>=2.32.3",
  "statsmodels",
  "streamlit",
  "uvicorn[standard]>=0.32.0",
  "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
  "ipykernel>=7.4.0",
  "narwhals",
  "pytest>=9.1.1",
  "python-dotenv>=1.2.4",
]

[tool.ruff]
extend = "~/.config/ruff/ruff.toml"
fix = true
show-fixes = true
line-length = 80
include = ["*.ipynb", "*.qmd"]

[tool.ruff.analyze]
detect-string-imports = true
exclude = ["generated"]

[tool.ruff.lint]
# Allow minus-sign (U+2212), greek-small-letter-rho (U+03C1), and the asterisk-operator (U+2217),
# which could be confused for "-", "p", and "*", respectively.
allowed-confusables = ["−", "ρ", "∗"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
exclude = ["generated"]
indent-style = "tab"
skip-magic-trailing-comma = true
docstring-code-format = true
docstring-code-line-length = 60
nested-string-quote-style = "alternating"
